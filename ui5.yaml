specVersion: "4.0"
metadata:
  name: lbs.videomanager
type: application
framework:
  name: OpenUI5
  version: "1.148.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
